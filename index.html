<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rio 3: Бортовой Журнал</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #121212; color: #e0e0e0; padding: 10px; line-height: 1.4; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { margin: 0 0 15px 0; font-size: 1rem; color: #ff5252; text-transform: uppercase; letter-spacing: 1px; }
        input, select { width: 100%; padding: 12px; margin: 5px 0; background: #2d2d2d; border: 1px solid #444; border-radius: 8px; color: white; font-size: 16px; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { width: 100%; padding: 15px; background: #d32f2f; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 10px; cursor: pointer; }
        button.alt { background: #454545; margin-top: 5px; }
        button.edit { background: #fbc02d; color: #000; margin-top: 10px; padding: 10px; }
        
        #modalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal { background: #1e1e1e; width: 90%; max-width: 400px; padding: 20px; border-radius: 16px; border: 1px solid #444; text-align: center; }
        .mode-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 15px; }
        .mode-btn { padding: 10px 5px; font-size: 12px; background: #333; border: 1px solid #555; border-radius: 8px; color: white; cursor: pointer; }
        .mode-btn:active { background: #d32f2f; }

        .log-item { background: #252525; padding: 12px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid #d32f2f; position: relative; }
        .log-item.pending { border-left-color: #ffeb3b; }
        .log-service { border-left-color: #2196f3; }
        .val { font-weight: bold; color: #4caf50; }
        .meta { font-size: 0.8rem; color: #aaa; margin-top: 5px; }
        .mode-tag { font-size: 0.7rem; background: #444; padding: 2px 6px; border-radius: 4px; color: #fff; margin-left: 5px; }
        .del { position: absolute; right: 10px; top: 10px; color: #666; background: none; border: none; font-size: 20px; }
        .summary { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px; color: #bbb; }
        .stat-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 4px 0; border-top: 1px solid #333; }
        label { font-size: 0.7rem; color: #888; margin-left: 5px; }
    </style>
</head>
<body>

<div id="modalOverlay">
    <div class="modal">
        <h2 style="color: #fbc02d;">Завершение записи</h2>
        <label>Пройденный путь (км)</label>
        <input type="number" id="modalDist" placeholder="Введите км">
        <label>Выберите цикл езды</label>
        <div class="mode-buttons">
            <div class="mode-btn" onclick="finishEntry('City')">🏙️<br>Город</div>
            <div class="mode-btn" onclick="finishEntry('Highway')">🛣️<br>Трасса</div>
            <div class="mode-btn" onclick="finishEntry('Mixed')">🔄<br>Смеш.</div>
        </div>
        <button class="alt" onclick="closeModal()">ОТМЕНА</button>
    </div>
</div>

<div class="card">
    <h2>Заправка / Поездка</h2>
    <div class="grid">
        <div><label>Дата</label><input type="date" id="fuelDate"></div>
        <div><label>Литры</label><input type="number" id="liters" placeholder="Литры"></div>
    </div>
    <div class="grid">
        <div><label>Сумма BYN</label><input type="number" id="cost" placeholder="Сумма"></div>
        <div><label>Ср. скор. (км/ч)</label><input type="number" id="speed" placeholder="км/ч"></div>
    </div>
    <input type="text" id="note" placeholder="Заметка (АЗС, АИ-95...)">
    <button onclick="addFuel()">ДОБАВИТЬ ЗАПРАВКУ</button>
</div>

<div class="card" style="border-left-color: #2196f3;">
    <h2>Прочие расходы</h2>
    <input type="date" id="serviceDate">
    <input type="text" id="serviceName" placeholder="На что потратил?">
    <input type="number" id="serviceCost" placeholder="Сумма (BYN)">
    <button class="alt" onclick="addService()">ЗАПИСАТЬ ТРАТУ</button>
</div>

<div id="stats" class="card">
    <h2>Общая статистика</h2>
    <div id="totalSummary"></div>
</div>

<div id="logs"></div>

<script>
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('fuelDate').value = today;
    document.getElementById('serviceDate').value = today;

    let fuelLog = JSON.parse(localStorage.getItem('rio_pro_log')) || [];
    let currentEditId = null;
    const modeLabels = { 'City': '🏙️ Город', 'Highway': '🛣️ Трасса', 'Mixed': '🔄 Смеш.' };

    function addFuel() {
        const liters = parseFloat(document.getElementById('liters').value);
        const cost = parseFloat(document.getElementById('cost').value);
        if(!liters || !cost) return alert('Введи литры и сумму!');
        const entry = {
            id: Date.now(),
            type: 'fuel',
            date: new Date(document.getElementById('fuelDate').value).toLocaleDateString(),
            liters: liters, cost: cost, dist: null, mode: null,
            speed: parseFloat(document.getElementById('speed').value) || null,
            note: document.getElementById('note').value, isCompleted: false
        };
        save(entry);
    }

    function openModal(id) { currentEditId = id; document.getElementById('modalOverlay').style.display = 'flex'; }
    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; document.getElementById('modalDist').value = ''; }

    function finishEntry(selectedMode) {
        const km = parseFloat(document.getElementById('modalDist').value);
        if(!km) return alert('Введи пробег!');
        const index = fuelLog.findIndex(item => item.id === currentEditId);
        if (index !== -1) {
            fuelLog[index].dist = km;
            fuelLog[index].mode = selectedMode;
            fuelLog[index].isCompleted = true;
            localStorage.setItem('rio_pro_log', JSON.stringify(fuelLog));
            closeModal(); render();
        }
    }

    function addService() {
        const entry = {
            id: Date.now(),
            type: 'service',
            date: new Date(document.getElementById('serviceDate').value).toLocaleDateString(),
            name: document.getElementById('serviceName').value,
            cost: parseFloat(document.getElementById('serviceCost').value)
        };
        if(!entry.name || !entry.cost) return alert('Введи данные!');
        save(entry);
    }

    function save(entry) {
        fuelLog.unshift(entry);
        localStorage.setItem('rio_pro_log', JSON.stringify(fuelLog));
        ['liters','cost','speed','note','serviceName','serviceCost'].forEach(id => {
            const el = document.getElementById(id); if(el) el.value = '';
        });
        render();
    }

    function deleteEntry(id) {
        if(confirm('Удалить?')) {
            fuelLog = fuelLog.filter(item => item.id !== id);
            localStorage.setItem('rio_pro_log', JSON.stringify(fuelLog));
            render();
        }
    }

    function render() {
        const container = document.getElementById('logs');
        const statsBox = document.getElementById('totalSummary');
        container.innerHTML = '';
        let totalCash = 0, totalDist = 0, totalLiters = 0;
        
        let cycleStats = {
            City: { l: 0, d: 0 },
            Highway: { l: 0, d: 0 },
            Mixed: { l: 0, d: 0 }
        };

        fuelLog.forEach((item) => {
            totalCash += item.cost;
            if(item.type === 'fuel') {
                const isPending = !item.isCompleted;
                let content = `<div class="log-item ${isPending ? 'pending' : ''}">
                    <button class="del" onclick="deleteEntry(${item.id})">×</button>
                    <div>${item.date} ${item.mode ? `<span class="mode-tag">${modeLabels[item.mode]}</span>` : ''}</div>
                    <div style="margin-top:5px;"><span class="val">${item.liters}л на ${item.cost} BYN</span></div>`;

                if(!isPending) {
                    totalDist += item.dist; totalLiters += item.liters;
                    cycleStats[item.mode].l += item.liters;
                    cycleStats[item.mode].d += item.dist;
                    const cons = ((item.liters / item.dist) * 100).toFixed(1);
                    content += `<div class="meta" style="color: #4caf50; font-weight: bold;">Расход: ${cons} л/100км</div>`;
                } else {
                    content += `<button class="edit" onclick="openModal(${item.id})">ВНЕСТИ ДАННЫЕ</button>`;
                }
                if(item.note) content += `<div class="meta">Заметка: ${item.note}</div>`;
                container.innerHTML += content + `</div>`;
            } else {
                container.innerHTML += `<div class="log-item log-service">
                    <button class="del" onclick="deleteEntry(${item.id})">×</button>
                    <div>${item.date} — <span class="val" style="color:#2196f3">${item.name}</span></div>
                    <div class="meta">Потрачено: ${item.cost} BYN</div>
                </div>`;
            }
        });

        let statsHTML = `
            <div class="summary"><span>Всего трат:</span> <b>${totalCash.toFixed(2)} BYN</b></div>
            <div class="summary"><span>Общий ср. расход:</span> <b>${totalDist > 0 ? ((totalLiters/totalDist)*100).toFixed(1) : 0} л/100км</b></div>
            <div style="margin-top:10px; color:#ff5252; font-size:0.75rem; font-weight:bold; text-transform:uppercase;">По циклам:</div>
        `;

        for (let mode in cycleStats) {
            if (cycleStats[mode].d > 0) {
                const avg = ((cycleStats[mode].l / cycleStats[mode].d) * 100).toFixed(1);
                statsHTML += `<div class="stat-row"><span>${modeLabels[mode]}</span> <b>${avg} л/100км</b></div>`;
            }
        }
        statsBox.innerHTML = statsHTML;
    }
    render();
</script>
</body>
</html>
