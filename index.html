<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rio 3: Максимальный Журнал</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #121212; color: #e0e0e0; padding: 10px; line-height: 1.4; margin: 0; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { margin: 0 0 15px 0; font-size: 1rem; color: #ff5252; text-transform: uppercase; letter-spacing: 1px; }
        label { font-size: 0.75rem; color: #888; display: block; margin: 5px 0 2px 5px; }
        input { width: 100%; padding: 12px; margin-bottom: 8px; background: #2d2d2d; border: 1px solid #444; border-radius: 8px; color: white; font-size: 16px; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        button { width: 100%; padding: 15px; background: #d32f2f; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 10px; cursor: pointer; transition: 0.2s; }
        button:active { background: #b71c1c; transform: scale(0.98); }
        button.alt { background: #454545; margin-top: 5px; }
        button.edit { background: #fbc02d; color: #000; margin-top: 10px; padding: 10px; font-size: 14px; }
        button.small-btn { padding: 6px 10px; font-size: 12px; background: #ff9800; color: #000; width: auto; display: inline-block; margin-top: 5px; }

        #modalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal { background: #1e1e1e; width: 92%; max-width: 400px; padding: 20px; border-radius: 16px; border: 1px solid #444; text-align: center; }
        
        .mode-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 15px 0; }
        .mode-btn { padding: 10px 5px; font-size: 11px; background: #333; border: 1px solid #555; border-radius: 8px; color: white; cursor: pointer; }
        .mode-btn.active { background: #d32f2f; border-color: #ff5252; font-weight: bold; }

        .log-item { background: #252525; padding: 15px; border-radius: 12px; margin-bottom: 12px; border-left: 5px solid #d32f2f; position: relative; }
        .log-item.pending { border-left-color: #fbc02d; }
        .log-item.service { border-left-color: #2196f3; }
        .val { font-weight: bold; color: #4caf50; font-size: 1.1rem; }
        .meta { font-size: 0.85rem; color: #aaa; margin-top: 6px; }
        .mode-tag { font-size: 0.7rem; background: #444; padding: 3px 7px; border-radius: 5px; color: #fff; margin-left: 5px; text-transform: uppercase; }
        .del { position: absolute; right: 12px; top: 12px; color: #555; background: none; border: none; font-size: 22px; cursor: pointer; }
        
        .summary { display: flex; justify-content: space-between; font-size: 1rem; margin-bottom: 8px; color: #ddd; }
        .stat-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr; font-size: 0.85rem; padding: 8px 0; border-top: 1px solid #333; }
        .toggle-container { background: #2d2d2d; padding: 12px; border-radius: 8px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div id="modalOverlay">
    <div class="modal">
        <h2 style="color: #fbc02d;">Завершение заезда</h2>
        <div id="odoHint" style="font-size: 0.8rem; color: #ff9800; text-align: left; margin-bottom: 10px; font-weight: bold;"></div>
        
        <div class="grid">
            <div><label>Одометр ФИНИШ</label><input type="number" id="mEndOdo" placeholder="км"></div>
            <div><label>Ср. скорость</label><input type="number" id="mSpeed" placeholder="км/ч"></div>
        </div>

        <div class="toggle-container">
            <span>⛽ Бак пуст в 0?</span>
            <input type="checkbox" id="mIsEmpty" style="width:25px; height:25px;" checked onchange="toggleLeftoverField()">
        </div>

        <div id="mLeftoverBox" style="display:none; text-align: left;">
            <label>Осталось в баке (литров)</label>
            <input type="number" id="mLeftAmount" placeholder="0.0">
            <button class="small-btn" onclick="document.getElementById('mLeftAmount').value=6">⛽ Лампа (~6л)</button>
        </div>

        <label style="margin-top:10px;">Цикл езды за этот пробег:</label>
        <div class="mode-buttons">
            <div class="mode-btn" onclick="selectModalMode('City', this)">🏙️<br>ГОРОД</div>
            <div class="mode-btn" onclick="selectModalMode('Highway', this)">🛣️<br>ТРАССА</div>
            <div class="mode-btn" onclick="selectModalMode('Mixed', this)">🔄<br>СМЕШАН.</div>
        </div>

        <button onclick="confirmEntry()">СОХРАНИТЬ ДАННЫЕ</button>
        <button class="alt" onclick="closeModal()">ОТМЕНА</button>
    </div>
</div>

<div class="card">
    <h2>Новая заправка</h2>
    <div class="grid">
        <div><label>Дата</label><input type="date" id="fDate"></div>
        <div><label>Литры (сколько залил)</label><input type="number" id="fLiters" placeholder="0.00"></div>
    </div>
    <div class="grid">
        <div><label>Сумма (BYN)</label><input type="number" id="fCost" placeholder="0.00"></div>
        <div><label>Одометр на АЗС</label><input type="number" id="fOdo" placeholder="км"></div>
    </div>
    <label>Заметка / Место заправки</label>
    <input type="text" id="fNote" placeholder="Например: Лукойл, АИ-95">
    <button onclick="addFuelEntry()">ДОБАВИТЬ В ЖУРНАЛ</button>
</div>

<div class="card" style="border-left: 5px solid #2196f3;">
    <h2>Сервис / Запчасти / СТО</h2>
    <div class="grid" style="grid-template-columns: 2fr 1fr;">
        <div><label>Что сделано / куплено?</label><input type="text" id="sName" placeholder="Замена масла, колодки..."></div>
        <div><label>Цена (BYN)</label><input type="number" id="sCost" placeholder="0.00"></div>
    </div>
    <button class="alt" style="border: 1px solid #2196f3;" onclick="addServiceEntry()">ЗАПИСАТЬ ТРАТУ</button>
</div>

<div class="card">
    <h2>Общая статистика</h2>
    <div id="statContent"></div>
</div>

<div id="logContainer"></div>

<script>
    let db = JSON.parse(localStorage.getItem('rio_final_db')) || [];
    let activeId = null;
    let activeMode = null;
    const modeNames = { 'City': '🏙️ Город', 'Highway': '🛣️ Трасса', 'Mixed': '🔄 Смеш.' };

    document.getElementById('fDate').value = new Date().toISOString().split('T')[0];

    function toggleLeftoverField() {
        const isEmp = document.getElementById('mIsEmpty').checked;
        document.getElementById('mLeftoverBox').style.display = isEmp ? 'none' : 'block';
    }

    function selectModalMode(m, btn) {
        activeMode = m;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function addFuelEntry() {
        const lit = parseFloat(document.getElementById('fLiters').value);
        const cost = parseFloat(document.getElementById('fCost').value);
        const odo = parseFloat(document.getElementById('fOdo').value);

        if(!lit || !cost || !odo) return alert('Заполни литры, сумму и одометр!');

        const entry = {
            id: Date.now(),
            type: 'fuel',
            date: document.getElementById('fDate').value,
            liters: lit,
            cost: cost,
            startOdo: odo,
            endOdo: null,
            mode: null,
            speed: null,
            leftover: 0,
            note: document.getElementById('fNote').value,
            isCompleted: false
        };

        db.unshift(entry);
        saveAndRefresh();
        
        document.getElementById('fLiters').value = '';
        document.getElementById('fCost').value = '';
        document.getElementById('fNote').value = '';
    }

    function addServiceEntry() {
        const name = document.getElementById('sName').value;
        const cost = parseFloat(document.getElementById('sCost').value);

        if(!name || !cost) return alert('Введи описание и стоимость!');

        const entry = {
            id: Date.now(),
            type: 'service',
            date: new Date().toLocaleDateString(),
            name: name,
            cost: cost
        };

        db.unshift(entry);
        saveAndRefresh();
        document.getElementById('sName').value = '';
        document.getElementById('sCost').value = '';
    }

    function openCompleteModal(id) {
        activeId = id;
        const item = db.find(x => x.id === id);
        document.getElementById('odoHint').innerText = `Одометр на момент заправки: ${item.startOdo} км`;
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
        activeId = null;
        activeMode = null;
    }

    function confirmEntry() {
        const endOdo = parseFloat(document.getElementById('mEndOdo').value);
        const left = document.getElementById('mIsEmpty').checked ? 0 : parseFloat(document.getElementById('mLeftAmount').value || 0);
        
        const idx = db.findIndex(x => x.id === activeId);
        
        if(!endOdo || !activeMode) return alert('Введи одометр и выбери цикл!');
        if(endOdo <= db[idx].startOdo) return alert('Одометр в конце должен быть больше стартового!');

        db[idx].endOdo = endOdo;
        db[idx].mode = activeMode;
        db[idx].leftover = left;
        db[idx].speed = document.getElementById('mSpeed').value;
        db[idx].isCompleted = true;

        saveAndRefresh();
        closeModal();
    }

    function saveAndRefresh() {
        localStorage.setItem('rio_final_db', JSON.stringify(db));
        render();
    }

    function deleteItem(id) {
        if(confirm('Удалить эту запись?')) {
            db = db.filter(x => x.id !== id);
            saveAndRefresh();
        }
    }

    function render() {
        const container = document.getElementById('logContainer');
        const statBox = document.getElementById('statContent');
        container.innerHTML = '';

        let totalMoney = 0;
        let totalDist = 0;
        let totalBurnedLiters = 0;
        let cycleStats = { City: {l:0, d:0, c:0}, Highway: {l:0, d:0, c:0}, Mixed: {l:0, d:0, c:0} };

        db.forEach(item => {
            totalMoney += item.cost;
            
            if(item.type === 'fuel') {
                const isDone = item.isCompleted;
                let html = `
                    <div class="log-item ${!isDone ? 'pending' : ''}">
                        <button class="del" onclick="deleteItem(${item.id})">×</button>
                        <div class="meta">${item.date} ${item.mode ? `<span class="mode-tag">${modeNames[item.mode]}</span>` : ''}</div>
                        <div class="val">${item.liters}л за ${item.cost} BYN</div>
                        <div class="meta">Одометр старт: ${item.startOdo} км</div>
                `;

                if(isDone) {
                    const dist = item.endOdo - item.startOdo;
                    const burned = item.liters - item.leftover;
                    const consumption = ((burned / dist) * 100).toFixed(1);
                    
                    totalDist += dist;
                    totalBurnedLiters += burned;
                    cycleStats[item.mode].l += burned;
                    cycleStats[item.mode].d += dist;
                    cycleStats[item.mode].c += item.cost;

                    html += `
                        <div class="meta" style="color:#4caf50; font-weight:bold; font-size:0.95rem;">Расход: ${consumption} л/100км (${dist} км)</div>
                        ${item.speed ? `<div class="meta">Ср. скорость: ${item.speed} км/ч</div>` : ''}
                        ${item.leftover > 0 ? `<div class="meta">Остаток в баке: ${item.leftover} л</div>` : ''}
                    `;
                } else {
                    html += `<button class="edit" onclick="openCompleteModal(${item.id})">ЗАВЕРШИТЬ ПОЕЗДКУ (ВНЕСТИ ФИНИШ)</button>`;
                }

                if(item.note) html += `<div class="meta" style="border-top:1px solid #333; padding-top:5px; margin-top:10px;">📝 ${item.note}</div>`;
                container.innerHTML += html + `</div>`;

            } else {
                container.innerHTML += `
                    <div class="log-item service">
                        <button class="del" onclick="deleteItem(${item.id})">×</button>
                        <div class="meta">${item.date} — ТРАТЫ / СЕРВИС</div>
                        <div class="val" style="color:#2196f3">${item.name}</div>
                        <div class="meta" style="font-size:1rem; color:#fff;">Сумма: ${item.cost} BYN</div>
                    </div>
                `;
            }
        });

        let statsHTML = `
            <div class="summary"><span>Всего потрачено:</span> <b>${totalMoney.toFixed(2)} BYN</b></div>
            <div class="summary"><span>Средний расход:</span> <b>${totalDist > 0 ? ((totalBurnedLiters/totalDist)*100).toFixed(1) : 0} л/100</b></div>
            <div style="margin: 15px 0 5px 0; color:#ff5252; font-size:0.75rem; font-weight:bold; text-transform:uppercase;">Аналитика по циклам:</div>
        `;

        for (let m in cycleStats) {
            if (cycleStats[m].d > 0) {
                const avg = ((cycleStats[m].l / cycleStats[m].d) * 100).toFixed(1);
                statsHTML += `
                    <div class="stat-row">
                        <span>${modeNames[m]}</span>
                        <b style="color:#4caf50">${avg} л</b>
                        <b>${cycleStats[m].c.toFixed(0)} BYN</b>
                    </div>
                `;
            }
        }
        statBox.innerHTML = statsHTML;
    }

    render();
</script>
</body>
</html>
